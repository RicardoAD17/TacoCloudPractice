security:
  user:
    name: buzz
    password: infinity

taco:
  orders:
    pageSize: 10

tacocloud:
  clock:
    zone: America/Mexico_City
  physics:
    min-ingredients: 2
    max-ingredients: 12
    drink-required-min-spice-rank: 4
    drink-types:
      - DRINK
    vegan-wrap-forbids-meat: true
  search:
    default-size: 20
    max-size: 50
  promotions:
    codes:
      TACO20:
        type: PERCENTAGE
        value: 20
        max-discount: 50.00
        valid-from: "2026-01-01T00:00:00"
        valid-until: "2027-12-31T23:59:59"
      MINUS10:
        type: FIXED
        value: 10.00
        min-purchase: 30.00
        valid-from: "2026-01-01T00:00:00"
        valid-until: "2027-12-31T23:59:59"
      VENCIDO50:
        type: PERCENTAGE
        value: 50
        valid-from: "2024-01-01T00:00:00"
        valid-until: "2024-12-31T23:59:59"
  messaging:
      transport: rabbit # Opciones: rabbit, kafka, jms, noop
      destination:
        order-events: "tacocloud.orders.topic"

#logging:
#  level:
#    org.springframework.data.rest: debug

# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
spring:
# end::springBootAdminUri[]
# end::springBootAdminCreds[]
  main:
    allow-bean-definition-overriding: true
  application:
    name: taco-cloud
  data:
    mongodb:
      auto-index-creation: true
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
      schema-action: recreate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
  boot:
    admin:
      client:
        url: http://localhost:9090
# end::springBootAdminUri[]
        username: admin
        password: 53cr3t
# end::springBootAdminCreds[]

# The values given here are actually the default values. But they are explicitly
# set here as an example of setting the Kafka properties.
  kafka:
    bootstrap-servers:
    - localhost:9092
    template:
      default-topic: tacocloud.orders.topic
    producer:
      keySerializer: org.springframework.kafka.support.serializer.JsonSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true

#tag::exposeAll[]
#tag::excludeSome[]
#tag::healthShowDetails[]
#tag::infoGitModeFull[]
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus,announcements
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    jms:
      enabled: false 
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: taco-cloud
#end::healthShowDetails[]
#tag::infoGitModeFull[]
  info:
    git:
      mode: full
#end::infoGitModeFull[]

#tag::contactInfo[]
info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831
#end::contactInfo[]

---
spring:
  profiles:
    active: rabbitmq
  
  datasource:
    url: jdbc:mysql://localhost/tacocloud
    username: tacouser
    password: tacopassword

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}] - %msg%n"
  level:
    tacos: INFO 
    org.springframework.security: DEBUG
library: resttemplate
useLombok: true
dateLibrary: java8